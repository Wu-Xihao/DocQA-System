# Explicit synthetic retrieval, native-text mechanism tests only.
# M01 in the Service guide generates this exact source directory.
allowed_source_roots: [../runtime/service-input-user]
types: [docx, pdf, pptx]
settle_seconds: 3
scan_interval_seconds: 1800
missing_confirmations: 2
max_pending_jobs: 1000
max_jobs_per_tick: 100
parse:
  office_render: never
  ocr_mode: disabled
  vision:
    mode: disabled
retrieval:
  mode: demo
  analyzer_terms: [SD5993, FE_HEART_Start, FE_HEART_Stop, DocBase]
