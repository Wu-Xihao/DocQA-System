# Copy to local.doc2md.yaml. Set local OCR/Office paths; model IDs must match your platform.
category: auto
allowed_roots:
- ../data/private/documents
- ../data/private/web-uploads
max_file_mb: 100
max_pages: 1000
max_pixels: 20000000
render_dpi: 144
render_pdf: true
office_render: auto
allow_legacy_office: false
office_executable: soffice
ocr_mode: auto
tesseract_executable: tesseract
tessdata_dir: null
ocr_languages: chi_sim+eng
external_timeout: 120
analysis_revision: qwen-vision-v1
vision:
  mode: http
  endpoint: https://ai.gitee.com/v1/chat/completions
  model: Qwen3.6-27B
  revision: gitee-managed-unpinned
  api_key_env: GITEE_AI_API_KEY
  enable_thinking: false
  timeout: 120
  retries: 1
