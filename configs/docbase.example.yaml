# Copy to configs/local.docbase.yaml (ignored by Git).
# http requires actual services conforming to the documented docbase.http.v1 contract.
mode: http
chunk:
  target_utf8_bytes: 2400
  max_utf8_bytes: 3600
  overlap_utf8_bytes: 320
analyzer_terms: [SD5993, FE_HEART_Start, FE_HEART_Stop, DocBase]
bm25_k1: 1.2
bm25_b: 0.75
route_top_n: 50
fusion_top_n: 50
top_k: 8
rrf_k: 60
route_weights: {dense: 1.0, bm25: 1.0, sparse: 1.0}
allow_degraded: false
dense:
  endpoint: ''              # Full explicit embedding endpoint.
  model: ''                 # Actual accepted model ID; do not guess.
  revision: ''
  tokenizer_revision: ''
  dimension: null           # Must equal verified actual output dimension.
  document_prefix: ''
  query_prefix: ''
  max_input_utf8_bytes: 32768
  batch_size: 16
  api_key_env: DOCQA_EMBEDDING_KEY
  timeout: 30
  retries: 2
sparse:
  endpoint: ''              # Must return real BGE-M3 learned lexical_weights.
  model: ''
  revision: ''
  tokenizer_revision: ''
  vocab_size: null          # Verified tokenizer vocabulary bound.
  max_input_utf8_bytes: 32768
  batch_size: 16
  api_key_env: DOCQA_SPARSE_KEY
  timeout: 30
  retries: 2
reranker:
  endpoint: ''
  model: ''
  revision: ''
  tokenizer_revision: ''
  max_input_utf8_bytes: 32768
  batch_size: 16
  api_key_env: DOCQA_RERANKER_KEY
  timeout: 30
  retries: 2
